name: apply-payment-hardening
on:
  push:
    branches:
      - fix/production-payment-idempotency-restored
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[payment-hardening-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-payment-idempotency-restored
          fetch-depth: 0
      - name: Patch booking persistence
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/booking.js')
          s = p.read_text()
          old = """    supa.from('payments').insert({
      stripe_session_id: session_id,
      stripe_payment_id: paymentIntentId || (session && session.payment_intent) || null,
      payment_intent_id: paymentIntentId || (session && session.payment_intent) || null,
      amount: customerPaid,
      supplier_amount: supplierAmount,
      margin_amount: marginAmount,
      currency: payCurrency,
      status: captureFailed ? 'failed' : 'paid',
      payment_status: paymentStatusFinal,
      captured_at: paymentStatusFinal === PAYMENT_STATUS.CAPTURED ? new Date().toISOString() : null,
      captured_amount: paymentStatusFinal === PAYMENT_STATUS.CAPTURED ? customerPaid : null,
    }).then(function(){}, function(e){ log('error', 'supa_payment_insert_failed', { error: e.message }); });
"""
          new = """    let paymentInsertError = null;
    try {
      const { error } = await supa.from('payments').upsert({
        stripe_session_id: session_id,
        stripe_payment_id: paymentIntentId || (session && session.payment_intent) || null,
        payment_intent_id: paymentIntentId || (session && session.payment_intent) || null,
        amount: customerPaid,
        supplier_amount: supplierAmount,
        margin_amount: marginAmount,
        currency: payCurrency,
        status: captureFailed ? 'failed' : 'paid',
        payment_status: paymentStatusFinal,
        captured_at: paymentStatusFinal === PAYMENT_STATUS.CAPTURED ? new Date().toISOString() : null,
        captured_amount: paymentStatusFinal === PAYMENT_STATUS.CAPTURED ? customerPaid : null,
      }, { onConflict: 'stripe_payment_id' });
      paymentInsertError = error || null;
      if (paymentInsertError) log('error', 'supa_payment_insert_failed', { error: paymentInsertError.message });
    } catch (e) {
      paymentInsertError = e;
      log('error', 'supa_payment_insert_failed', { error: e.message });
    }
"""
          if old not in s:
              raise SystemExit('payments block not found')
          s = s.replace(old, new, 1)
          old2 = """      const { error: bookingInsertError } = await supa.from('bookings').upsert({"""
          new2 = """      const { error: bookingInsertError } = await supa.from('bookings').upsert({"""
          if old2 not in s:
              raise SystemExit('booking upsert start not found')
          s = s.replace(old2, new2, 1)
          old3 = """      }, { onConflict: 'stripe_session_id', ignoreDuplicates: true });
      if (bookingInsertError) log('error', 'supa_booking_insert_failed', { error: bookingInsertError.message });
    } catch (e) {
      log('error', 'supa_booking_insert_failed', { error: e.message });
    }
"""
          new3 = """      }, { onConflict: 'stripe_session_id' });
      if (bookingInsertError) log('error', 'supa_booking_insert_failed', { error: bookingInsertError.message });
      if (bookingInsertError) paymentInsertError = paymentInsertError || bookingInsertError;
    } catch (e) {
      paymentInsertError = paymentInsertError || e;
      log('error', 'supa_booking_insert_failed', { error: e.message });
    }

    // A supplier booking + successful Stripe capture is financially real.
    // Never tell the customer it is confirmed if the durable ledger/booking
    // rows could not be persisted. Leave the captured transaction/order intact
    // and route it to manual recovery instead of creating a second booking or
    // blindly refunding a supplier booking that has already been fulfilled.
    if (paymentInsertError) {
      const persistenceError = paymentInsertError && paymentInsertError.message
        ? paymentInsertError.message
        : String(paymentInsertError);
      setBookingStatus(session_id, 'manual_review', {
        order_id: orderId,
        booking_reference: bookingRef,
        error: persistenceError,
        recovery_required: true,
      });
      setPaymentStatus(session_id, PAYMENT_STATUS.MANUAL_REVIEW);
      try {
        await alertCritical('booking_persistence_failed_after_supplier_booking', {
          session_id,
          order_id: orderId || null,
          payment_intent_id: paymentIntentId || null,
          payment_status: paymentStatusFinal,
          error: persistenceError,
        });
      } catch (alertErr) {
        log('error', 'booking_persistence_alert_failed', { session_id, error: alertErr.message });
      }
      const err = errorWithCode('Booking completed upstream but durable payment/booking persistence failed; manual recovery required', 'BOOKING_PERSISTENCE_FAILED_AFTER_CAPTURE');
      err.status = 202;
      err.manualReview = true;
      err.captured = paymentStatusFinal === PAYMENT_STATUS.CAPTURED;
      throw err;
    }
"""
          if old3 not in s:
              raise SystemExit('booking upsert block not found')
          s = s.replace(old3, new3, 1)
          p.write_text(s)
      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/booking.js
          git rm .github/workflows/apply-payment-hardening.yml
          git commit -m "fix: make post-capture persistence durable [payment-hardening-bot]"
          git push origin fix/production-payment-idempotency-restored
