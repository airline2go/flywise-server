name: One-off localized SEO refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-localized-refresh-2026-09.yml"

permissions:
  contents: read

concurrency:
  group: airpiv-localized-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      API_BASE: https://api.airpiv.com
    steps:
      - name: Preflight and bounded localized SEO refresh
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}" || { echo "ADMIN_TOKEN repository secret is not configured" >&2; exit 1; }

          wait_for_batch() {
            local lang="$1"
            local offset="$2"
            local expected="$3"
            local status=""
            local running=""
            local seen_running="false"

            for _ in $(seq 1 360); do
              status="$(curl --fail-with-body --silent --show-error \
                --request GET \
                --header "Authorization: Bearer $ADMIN_TOKEN" \
                --header "Accept: application/json" \
                "$API_BASE/admin/seo/localized-batch-status")"

              running="$(printf '%s' "$status" | jq -r '.running // false')"
              if [[ "$running" == "true" ]]; then
                seen_running="true"
              fi

              if [[ "$seen_running" == "true" && "$running" == "false" ]]; then
                local state_lang state_offset total processed failed rejected
                state_lang="$(printf '%s' "$status" | jq -r '.language // empty')"
                state_offset="$(printf '%s' "$status" | jq -r '.offset // -1')"
                total="$(printf '%s' "$status" | jq -r '.summary.total // .progress.total // -1')"
                processed="$(printf '%s' "$status" | jq -r '.summary.processed // .progress.processed // -1')"
                failed="$(printf '%s' "$status" | jq -r '.summary.failed // -1')"
                rejected="$(printf '%s' "$status" | jq -r '.summary.qualityRejected // -1')"

                echo "$status" | jq .

                [[ "$state_lang" == "$lang" ]] || { echo "Wrong language in completed batch: $state_lang != $lang" >&2; exit 1; }
                [[ "$state_offset" == "$offset" ]] || { echo "Wrong offset in completed batch: $state_offset != $offset" >&2; exit 1; }
                [[ "$total" == "$expected" ]] || { echo "Unexpected processed total: $total != $expected" >&2; exit 1; }
                [[ "$processed" == "$expected" ]] || { echo "Unexpected processed count: $processed != $expected" >&2; exit 1; }
                [[ "$failed" == "0" ]] || { echo "Batch failures: $failed" >&2; exit 1; }
                [[ "$rejected" == "0" ]] || { echo "Quality rejections: $rejected" >&2; exit 1; }
                return 0
              fi

              sleep 5
            done

            echo "Timed out waiting for $lang offset $offset" >&2
            exit 1
          }

          for lang in en es fr it nl tr; do
            echo "=== DRY-RUN $lang ==="
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $ADMIN_TOKEN" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "{\"language\":\"$lang\",\"offset\":0,\"limit\":5,\"dry_run\":true,\"force\":true}" \
              "$API_BASE/admin/seo/localized-batch-generate")"
            echo "$response"
            printf '%s' "$response" | jq -e '.ok == true and .status == "processing"' >/dev/null
            wait_for_batch "$lang" "0" "5"
            sleep 1
          done

          for lang in en es fr it nl tr; do
            for offset in 0 100 200 300 400 500 600 700 800 900 1000 1100 1200 1300 1400 1500 1600 1700; do
              remaining=$((1753 - offset))
              if (( remaining > 100 )); then expected=100; else expected=$remaining; fi

              echo "=== REFRESH $lang offset=$offset limit=100 expected=$expected ==="
              response="$(curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $ADMIN_TOKEN" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --data "{\"language\":\"$lang\",\"offset\":$offset,\"limit\":100,\"dry_run\":false,\"force\":true}" \
                "$API_BASE/admin/seo/localized-batch-generate")"
              echo "$response"
              printf '%s' "$response" | jq -e '.ok == true and .status == "processing"' >/dev/null

              wait_for_batch "$lang" "$offset" "$expected"
              sleep 1
            done
          done
