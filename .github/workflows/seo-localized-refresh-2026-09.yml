name: One-off localized SEO refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-localized-refresh-2026-09.yml"

permissions:
  contents: read

concurrency:
  group: airpiv-localized-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      API_BASE: https://api.airpiv.com
      BROWSER_UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
    steps:
      - name: Preflight and bounded localized SEO refresh
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}" || { echo "ADMIN_TOKEN repository secret is not configured" >&2; exit 1; }

          run_batch() {
            local lang="$1"
            local offset="$2"
            local limit="$3"
            local dry_run="$4"
            local expected="$5"
            local before before_finished before_started
            before="$(curl --fail-with-body --silent --show-error \
              --request GET \
              --user-agent "$BROWSER_UA" \
              --header "Authorization: Bearer $ADMIN_TOKEN" \
              --header "Accept: application/json" \
              "$API_BASE/admin/seo/localized-batch-status")"
            before_finished="$(printf '%s' "$before" | jq -r '.finishedAt // empty')"
            before_started="$(printf '%s' "$before" | jq -r '.startedAt // empty')"

            echo "Submitting lang=$lang offset=$offset limit=$limit dry_run=$dry_run"
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --user-agent "$BROWSER_UA" \
              --header "Authorization: Bearer $ADMIN_TOKEN" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "{\"language\":\"$lang\",\"offset\":$offset,\"limit\":$limit,\"dry_run\":$dry_run,\"force\":true}" \
              "$API_BASE/admin/seo/localized-batch-generate")"
            echo "$response"
            printf '%s' "$response" | jq -e '.ok == true and .status == "processing"' >/dev/null

            for _ in $(seq 1 360); do
              status="$(curl --fail-with-body --silent --show-error \
                --request GET \
                --user-agent "$BROWSER_UA" \
                --header "Authorization: Bearer $ADMIN_TOKEN" \
                --header "Accept: application/json" \
                "$API_BASE/admin/seo/localized-batch-status")"
              running="$(printf '%s' "$status" | jq -r '.running // false')"
              state_lang="$(printf '%s' "$status" | jq -r '.language // empty')"
              state_offset="$(printf '%s' "$status" | jq -r '.offset // -1')"
              finished="$(printf '%s' "$status" | jq -r '.finishedAt // empty')"
              started="$(printf '%s' "$status" | jq -r '.startedAt // empty')"

              if [[ "$running" == "false" && "$state_lang" == "$lang" && "$state_offset" == "$offset" && -n "$finished" && "$finished" != "$before_finished" && "$started" != "$before_started" ]]; then
                total="$(printf '%s' "$status" | jq -r '.summary.total // -1')"
                processed="$(printf '%s' "$status" | jq -r '.summary.processed // -1')"
                updated="$(printf '%s' "$status" | jq -r '.summary.updated // -1')"
                failed="$(printf '%s' "$status" | jq -r '.summary.failed // -1')"
                rejected="$(printf '%s' "$status" | jq -r '.summary.qualityRejected // -1')"
                echo "$status" | jq .

                [[ "$total" == "$expected" ]] || { echo "Unexpected total: $total != $expected" >&2; exit 1; }
                [[ "$processed" == "$expected" ]] || { echo "Unexpected processed: $processed != $expected" >&2; exit 1; }
                [[ "$updated" == "$expected" ]] || { echo "Unexpected updated: $updated != $expected" >&2; exit 1; }
                [[ "$failed" == "0" ]] || { echo "Batch failures: $failed" >&2; exit 1; }
                [[ "$rejected" == "0" ]] || { echo "Quality rejections: $rejected" >&2; exit 1; }
                return 0
              fi

              sleep 5
            done

            echo "Timed out waiting for $lang offset $offset" >&2
            exit 1
          }

          for lang in en es fr it nl tr; do
            echo "=== DRY-RUN $lang ==="
            run_batch "$lang" "0" "5" "true" "5"
            sleep 1
          done

          for lang in en es fr it nl tr; do
            for offset in 0 100 200 300 400 500 600 700 800 900 1000 1100 1200 1300 1400 1500 1600 1700; do
              remaining=$((1753 - offset))
              if (( remaining > 100 )); then expected=100; else expected=$remaining; fi
              echo "=== REFRESH $lang offset=$offset expected=$expected ==="
              run_batch "$lang" "$offset" "100" "false" "$expected"
              sleep 1
            done
          done
