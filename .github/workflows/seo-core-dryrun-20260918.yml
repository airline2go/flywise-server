name: Temporary SEO Core Dry Run

on:
  push:
    branches:
      - ops/seo-core-dryrun-20260918

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run authenticated core-only SEO dry run
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "ADMIN_TOKEN repository secret is not configured" >&2
            exit 1
          fi

          echo "=== Starting SEO batch dry-run ==="
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"dry_run":true,"force":false}' \
            https://api.airpiv.com/admin/seo/batch-generate
          echo

          for i in $(seq 1 180); do
            body="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $ADMIN_TOKEN" \
              --header "Accept: application/json" \
              https://api.airpiv.com/admin/seo/batch-status)"

            echo "=== Batch status poll $i ==="
            echo "$body" | jq .

            running="$(echo "$body" | jq -r '.running // false')"
            if [ "$running" = "false" ]; then
              echo "=== Final summary ==="
              echo "$body" | jq '.summary // {}'
              exit 0
            fi

            sleep 4
          done

          echo "SEO batch dry-run did not finish within polling window" >&2
          exit 1
