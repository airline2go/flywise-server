name: Localized SEO refresh diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-localized-diagnostic-2026-09.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      API_BASE: https://api.airpiv.com
      BROWSER_UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
    steps:
      - name: Run one real localized SEO batch (en offset 0 limit 100)
        shell: bash
        run: |
          set -u
          mkdir -p diagnostic
          {
            echo "timestamp=$(date -u +%FT%TZ)"
            echo "admin_token_present=$([[ -n "${ADMIN_TOKEN:-}" ]] && echo true || echo false)"
            echo "This run performs one real batch: en offset=0 limit=100 dry_run=false force=true."
            echo "--- PRE-BATCH STATUS ---"
            curl --silent --show-error \
              --request GET \
              --user-agent "$BROWSER_UA" \
              --header "Authorization: Bearer ${ADMIN_TOKEN:-}" \
              --header "Accept: application/json" \
              "$API_BASE/admin/seo/localized-batch-status" | tee diagnostic/pre-status.json
            echo
            before_finished="$(curl --silent --show-error \
              --request GET \
              --user-agent "$BROWSER_UA" \
              --header "Authorization: Bearer ${ADMIN_TOKEN:-}" \
              --header "Accept: application/json" \
              "$API_BASE/admin/seo/localized-batch-status" | jq -r '.finishedAt // empty')"
            before_started="$(curl --silent --show-error \
              --request GET \
              --user-agent "$BROWSER_UA" \
              --header "Authorization: Bearer ${ADMIN_TOKEN:-}" \
              --header "Accept: application/json" \
              "$API_BASE/admin/seo/localized-batch-status" | jq -r '.startedAt // empty')"

            echo "--- SUBMIT ---"
            http_code="$(curl --silent --show-error --output diagnostic/post.json --write-out '%{http_code}' \
              --request POST \
              --user-agent "$BROWSER_UA" \
              --header "Authorization: Bearer ${ADMIN_TOKEN:-}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data '{"language":"en","offset":0,"limit":100,"dry_run":false,"force":true}' \
              "$API_BASE/admin/seo/localized-batch-generate" 2>diagnostic/post.stderr || true)"
            echo "http_code=$http_code"
            cat diagnostic/post.json || true
            echo
            cat diagnostic/post.stderr || true
            echo "--- POLL ---"

            completed="false"
            for i in $(seq 1 600); do
              status="$(curl --silent --show-error \
                --request GET \
                --user-agent "$BROWSER_UA" \
                --header "Authorization: Bearer ${ADMIN_TOKEN:-}" \
                --header "Accept: application/json" \
                "$API_BASE/admin/seo/localized-batch-status" || true)"
              printf '%s' "$status" > "diagnostic/status-$i.json"
              if [[ "$i" == "1" || "$((i % 10))" == "0" ]]; then
                echo "poll=$i timestamp=$(date -u +%FT%TZ)"
                echo "$status" | jq . || true
              fi
              running="$(printf '%s' "$status" | jq -r '.running // false')"
              state_lang="$(printf '%s' "$status" | jq -r '.language // empty')"
              state_offset="$(printf '%s' "$status" | jq -r '.offset // -1')"
              finished="$(printf '%s' "$status" | jq -r '.finishedAt // empty')"
              started="$(printf '%s' "$status" | jq -r '.startedAt // empty')"
              if [[ "$running" == "false" && "$state_lang" == "en" && "$state_offset" == "0" && -n "$finished" && "$finished" != "$before_finished" && "$started" != "$before_started" ]]; then
                echo "--- COMPLETED BATCH ---"
                echo "$status" | jq .
                completed="true"
                break
              fi
              sleep 1
            done

            if [[ "$completed" != "true" ]]; then
              echo "TIMEOUT/NO-COMPLETION" >&2
              exit 2
            fi
          } | tee diagnostic/summary.txt

      - name: Upload actual batch evidence
        uses: actions/upload-artifact@v4
        with:
          name: seo-localized-actual-batch-en-0-100
          path: diagnostic/
          if-no-files-found: error
