name: Route Pages Backfill

on:
  workflow_dispatch:
    inputs:
      batches:
        description: "Number of bounded batches to run (10 routes per batch)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run bounded backfill batches
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BATCHES: ${{ inputs.batches }}
        run: |
          set -euo pipefail
          case "$BATCHES" in
            ''|*[!0-9]*) echo "batches must be a non-negative integer" >&2; exit 1 ;;
          esac
          if [ "$BATCHES" -lt 1 ] || [ "$BATCHES" -gt 50 ]; then
            echo "batches must be between 1 and 50" >&2
            exit 1
          fi
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "ADMIN_TOKEN repository secret is not configured" >&2
            exit 1
          fi

          for i in $(seq 1 "$BATCHES"); do
            echo "=== Backfill batch $i/$BATCHES ==="
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $ADMIN_TOKEN" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              https://api.airpiv.com/admin/route-pages/backfill-airlines-batch
            echo
            if [ "$i" -lt "$BATCHES" ]; then
              sleep 1
            fi
          done
