name: One-off localized SEO refresh v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-localized-refresh-v2-2026-09.yml"

permissions:
  contents: read

concurrency:
  group: airpiv-localized-seo-refresh-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      API_BASE: https://api.airpiv.com
      BROWSER_UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
    steps:
      - name: Run bounded localized SEO refresh
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}" || { echo "ADMIN_TOKEN repository secret is not configured" >&2; exit 1; }

          wait_idle() {
            for _ in $(seq 1 60); do
              status="$(curl --fail-with-body --silent --show-error \
                --request GET \
                --user-agent "$BROWSER_UA" \
                --header "Authorization: Bearer $ADMIN_TOKEN" \
                --header "Accept: application/json" \
                "$API_BASE/admin/seo/localized-batch-status")"
              running="$(printf '%s' "$status" | jq -r '.running // false')"
              if [[ "$running" == "false" ]]; then return 0; fi
              sleep 2
            done
            echo "Backend localized SEO batch remained busy for 120 seconds." >&2
            return 1
          }

          run_batch() {
            local lang="$1"
            local offset="$2"
            local limit="$3"
            local dry_run="$4"
            local expected="$5"

            for attempt in 1 2 3; do
              echo "=== $lang offset=$offset limit=$limit dry_run=$dry_run attempt=$attempt ==="
              wait_idle || { echo "Backend remained busy before $lang offset $offset" >&2; continue; }

              response="$(curl --fail-with-body --silent --show-error \
                --request POST \
                --user-agent "$BROWSER_UA" \
                --header "Authorization: Bearer $ADMIN_TOKEN" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --data "{\"language\":\"$lang\",\"offset\":$offset,\"limit\":$limit,\"dry_run\":$dry_run,\"force\":true}" \
                "$API_BASE/admin/seo/localized-batch-generate")"
              echo "$response"
              printf '%s' "$response" | jq -e '.ok == true and .status == "processing"' >/dev/null

              # Allow fast batches to settle, but keep the refresh bounded and restart-safe.
              sleep 4

              retry_needed=false
              for _ in $(seq 1 60); do
                status="$(curl --fail-with-body --silent --show-error \
                  --request GET \
                  --user-agent "$BROWSER_UA" \
                  --header "Authorization: Bearer $ADMIN_TOKEN" \
                  --header "Accept: application/json" \
                  "$API_BASE/admin/seo/localized-batch-status")"

                running="$(printf '%s' "$status" | jq -r '.running // false')"
                state_lang="$(printf '%s' "$status" | jq -r '.language // empty')"
                state_offset="$(printf '%s' "$status" | jq -r '.offset // -1')"

                if [[ "$running" == "false" && "$state_lang" == "$lang" && "$state_offset" == "$offset" ]]; then
                  total="$(printf '%s' "$status" | jq -r '.summary.total // -1')"
                  processed="$(printf '%s' "$status" | jq -r '.summary.processed // -1')"
                  updated="$(printf '%s' "$status" | jq -r '.summary.updated // -1')"
                  skipped="$(printf '%s' "$status" | jq -r '.summary.skipped // -1')"
                  failed="$(printf '%s' "$status" | jq -r '.summary.failed // -1')"
                  rejected="$(printf '%s' "$status" | jq -r '.summary.qualityRejected // -1')"
                  echo "$status" | jq .

                  [[ "$total" == "$expected" ]] || { echo "Unexpected total: $total != $expected" >&2; retry_needed=true; break; }
                  [[ "$processed" == "$expected" ]] || { echo "Unexpected processed: $processed != $expected" >&2; retry_needed=true; break; }
                  [[ "$updated" == "$expected" ]] || { echo "Unexpected updated: $updated != $expected" >&2; retry_needed=true; break; }
                  [[ "$skipped" == "0" ]] || { echo "Unexpected skipped: $skipped" >&2; retry_needed=true; break; }
                  [[ "$failed" == "0" ]] || { echo "Batch failures: $failed" >&2; retry_needed=true; break; }
                  [[ "$rejected" == "0" ]] || { echo "Quality rejections: $rejected" >&2; retry_needed=true; break; }

                  return 0
                fi

                # A backend instance restart clears the in-memory batch state.
                # force=true makes re-submitting the same bounded batch idempotent.
                if [[ "$running" == "false" && "$state_lang" != "$lang" ]]; then
                  echo "Batch state disappeared before completion; retrying bounded batch." >&2
                  retry_needed=true
                  break
                fi

                sleep 2
              done

              if [[ "$retry_needed" == "true" ]]; then
                sleep 2
                continue
              fi

              echo "Timed out waiting for $lang offset $offset on attempt $attempt" >&2
            done

            echo "Failed bounded batch after 3 attempts: $lang offset $offset" >&2
            exit 1
          }

          for lang in en es fr it nl tr; do
            run_batch "$lang" 0 5 true 5
          done

          for lang in es fr it nl tr; do
            for offset in 0 100 200 300 400 500 600 700 800 900 1000 1100 1200 1300 1400 1500 1600 1700; do
              remaining=$((1753 - offset))
              if (( remaining > 100 )); then expected=100; else expected=$remaining; fi
              run_batch "$lang" "$offset" 100 false "$expected"
            done
          done

          # English offset 0 was already refreshed and verified at 100/100.
          for offset in 100 200 300 400 500 600 700 800 900 1000 1100 1200 1300 1400 1500 1600 1700; do
            remaining=$((1753 - offset))
            if (( remaining > 100 )); then expected=100; else expected=$remaining; fi
            run_batch en "$offset" 100 false "$expected"
          done
