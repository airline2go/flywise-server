name: CI Checks (Backend)

# [CI-PIPELINE-FIX] Runs on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server.js syntax
        run: node --check server.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Lint (non-blocking)
        run: npx eslint .
        continue-on-error: true
      - name: Dependency vulnerability audit (non-blocking)
        run: npm audit --omit=dev
        continue-on-error: true

  seo-core-dryrun:
    if: github.head_ref == 'ops/seo-core-dryrun-20260918-b'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Regenerate audited stale core route
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "ADMIN_TOKEN repository secret is not configured" >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer $ADMIN_TOKEN"             --header "User-Agent: AirpivAdminCI/1.0 (+https://airpiv.com)"             --header "Accept: application/json"             --header "Content-Type: application/json"             --data '{"language":"de","dry_run":false,"force":true}'             https://api.airpiv.com/admin/seo/route/d82801b2-26d9-494c-819b-26c6d67aa6fd | jq .
