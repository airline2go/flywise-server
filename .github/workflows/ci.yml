name: CI Checks (Backend)

# [CI-PIPELINE-FIX] Runs on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server.js syntax
        run: node --check server.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Lint (non-blocking)
        run: npx eslint .
        continue-on-error: true
      - name: Dependency vulnerability audit (non-blocking)
        run: npm audit --omit=dev
        continue-on-error: true
