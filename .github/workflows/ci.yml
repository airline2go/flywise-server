name: CI Checks (Backend)

# [CI-PIPELINE-FIX] Runs on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server.js syntax
        run: node --check server.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Lint (non-blocking)
        run: npx eslint .
        continue-on-error: true
      - name: Dependency vulnerability audit (non-blocking)
        run: npm audit --omit=dev
        continue-on-error: true

  seo-core-dryrun:
    if: github.head_ref == 'ops/seo-core-dryrun-20260918-b'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run authenticated core-only SEO dry run
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "ADMIN_TOKEN repository secret is not configured" >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer $ADMIN_TOKEN"             --header "User-Agent: AirpivAdminCI/1.0 (+https://airpiv.com)"             --header "Accept: application/json"             --header "Content-Type: application/json"             --data '{"dry_run":false,"force":false}'             https://api.airpiv.com/admin/seo/batch-generate

          for i in $(seq 1 180); do
            body="$(curl --fail-with-body --silent --show-error               --header "Authorization: Bearer $ADMIN_TOKEN"               --header "User-Agent: AirpivAdminCI/1.0 (+https://airpiv.com)"               --header "Accept: application/json"               https://api.airpiv.com/admin/seo/batch-status)"
            echo "=== Batch status poll $i ==="
            echo "$body" | jq .
            running="$(echo "$body" | jq -r '.running // false')"
            if [ "$running" = "false" ]; then
              echo "=== Final summary ==="
              echo "$body" | jq '.summary // {}'
              exit 0
            fi
            sleep 4
          done

          echo "SEO batch dry-run did not finish within polling window" >&2
          exit 1
